[build-system]
requires = [
    "setuptools>=75",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "familyos-cli"
version = "0.1.0"
description = "CLI for generating and validating FamilyOS projects"
readme = "README.md"
requires-python = ">=3.13"

license = { text = "MIT" }

authors = [
    { name = "FamilyOS Team" },
]

dependencies = [
    "packaging>=26.0",
    "typer>=0.16",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.11",
]

[project.optional-dependencies]
dev = [
    "build>=1.5",
    "pytest>=8.4",
    "ruff>=0.12",
    "mypy>=1.17",
    "types-PyYAML>=6.0",
    "pip-tools==7.6.1",
]

[project.scripts]
familyos = "familyos_cli.main:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.setuptools.package-data]
familyos_cli = [
    "py.typed",
    "plugins/builtin/*/plugin.yaml",
    "plugins/builtin/*/templates/**/*.j2",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true

warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]
