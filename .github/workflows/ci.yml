name: Canonical CI Validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Install FamilyOS without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Run canonical CI validation
        id: canonical_validation
        continue-on-error: true
        run: familyos validation ci --output ci-validation.json

      - name: Upload canonical validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: familyos-ci-validation
          path: ci-validation.json
          if-no-files-found: error

      - name: Preserve canonical validation result
        if: always() && steps.canonical_validation.outcome != 'success'
        run: exit 1

      - name: Run canonical package build
        id: canonical_package_build
        run: >-
          familyos build
          --profile ci
          --output-dir dist
          --evidence-output build-evidence.json

      - name: Upload canonical Build Evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: familyos-build-evidence
          path: build-evidence.json
          if-no-files-found: error

      - name: Upload package candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: familyos-package-candidates
          path: dist/
          if-no-files-found: error

  cache-free-validation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13 without cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies without cache
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Install FamilyOS without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Run canonical CI validation
        run: familyos validation ci --output ci-validation.json

      - name: Run canonical package build
        run: >-
          familyos build
          --profile ci
          --output-dir dist
          --evidence-output build-evidence.json

  artifact-validation:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download package candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: familyos-package-candidates
          path: dist

      - name: Download canonical Build Evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: familyos-build-evidence
          path: evidence

      - name: Verify transferred artifact integrity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          candidate_root = Path("dist")
          evidence_path = Path("evidence/build-evidence.json")

          if not evidence_path.is_file():
              raise SystemExit(
                  "missing canonical Build Evidence: "
                  f"{evidence_path}"
              )

          payload = json.loads(
              evidence_path.read_text(encoding="utf-8")
          )

          raw_integrities = payload.get("artifact_integrities")

          if not isinstance(raw_integrities, list):
              raise SystemExit(
                  "missing artifact_integrities in canonical Build Evidence"
              )

          if not raw_integrities:
              raise SystemExit(
                  "missing canonical artifact integrity records"
              )

          expected: dict[Path, str] = {}

          for record in raw_integrities:
              if not isinstance(record, dict):
                  raise SystemExit(
                      "invalid artifact integrity record"
                  )

              algorithm = record.get("algorithm")
              raw_path = record.get("path")
              digest = record.get("digest")

              if algorithm != "sha256":
                  raise SystemExit(
                      "unsupported artifact integrity algorithm: "
                      f"{algorithm!r}"
                  )

              if not isinstance(raw_path, str):
                  raise SystemExit(
                      "invalid artifact integrity path"
                  )

              if not isinstance(digest, str):
                  raise SystemExit(
                      "invalid artifact integrity digest"
                  )

              evidence_artifact_path = Path(raw_path)

              if evidence_artifact_path.name != raw_path and not (
                  evidence_artifact_path.is_absolute()
                  or evidence_artifact_path.parent.name == candidate_root.name
              ):
                  raise SystemExit(
                      "invalid artifact integrity path: "
                      f"{evidence_artifact_path}"
                  )

              artifact_path = candidate_root / evidence_artifact_path.name

              if artifact_path in expected:
                  raise SystemExit(
                      "duplicate artifact integrity path: "
                      f"{artifact_path}"
                  )

              expected[artifact_path] = digest

          actual = {
              path
              for path in candidate_root.iterdir()
              if path.is_file()
          }

          expected_paths = set(expected)

          missing = sorted(expected_paths - actual)
          unexpected = sorted(actual - expected_paths)

          if missing:
              raise SystemExit(
                  "missing transferred artifact(s): "
                  + ", ".join(str(path) for path in missing)
              )

          if unexpected:
              raise SystemExit(
                  "unexpected transferred artifact(s): "
                  + ", ".join(str(path) for path in unexpected)
              )

          for artifact_path, expected_digest in sorted(
              expected.items(),
              key=lambda item: str(item[0]),
          ):
              observed_digest = hashlib.sha256(
                  artifact_path.read_bytes()
              ).hexdigest()

              if observed_digest != expected_digest:
                  raise SystemExit(
                      "digest mismatch for transferred artifact "
                      f"{artifact_path}: "
                      f"expected {expected_digest}, "
                      f"observed {observed_digest}"
                  )

          print(
              "Transferred artifact integrity verified:",
              len(expected),
              "artifact(s)",
          )
          PY

  release-handoff:
    needs: artifact-validation
    runs-on: ubuntu-latest
    steps:
      - name: Download validated package candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: familyos-package-candidates
          path: dist

      - name: Download validated Build Evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: familyos-build-evidence
          path: evidence

  quality-observation:
    name: Quality Framework observation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Install FamilyOS without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Capture source before Quality observation
        continue-on-error: true
        run: >-
          python -m scripts.capture_quality_source
          --phase before
          --repository "$GITHUB_WORKSPACE"
          --expected-revision "$GITHUB_SHA"
          --output-dir "$RUNNER_TEMP/familyos-quality-p4-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --event "$GITHUB_EVENT_NAME"

      - name: Run Quality Framework observation
        id: quality_observation
        run: >-
          python -m scripts.run_quality_ci
          --repository "$GITHUB_WORKSPACE"
          --expected-revision "$GITHUB_SHA"
          --output-dir "$RUNNER_TEMP/familyos-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Capture source after Quality observation
        if: always()
        env:
          QUALITY_STEP_OUTCOME: ${{ steps.quality_observation.outcome }}
        run: >-
          python -m scripts.capture_quality_source
          --phase after
          --repository "$GITHUB_WORKSPACE"
          --expected-revision "$GITHUB_SHA"
          --output-dir "$RUNNER_TEMP/familyos-quality-p4-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --run-id "$GITHUB_RUN_ID"
          --run-attempt "$GITHUB_RUN_ATTEMPT"
          --event "$GITHUB_EVENT_NAME"
          --quality-output "$RUNNER_TEMP/familyos-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --quality-step-outcome "$QUALITY_STEP_OUTCOME"

      - name: Upload Quality observation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: familyos-quality-observation
          path: ${{ runner.temp }}/familyos-quality-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error

      - name: Upload P4 source observation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: familyos-quality-source-observation
          path: ${{ runner.temp }}/familyos-quality-p4-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
